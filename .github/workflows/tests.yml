name: Tests

# The .sm4 measurement files in test/ are proprietary and live only on the
# maintainer's machine, so the golden-master characterization tests run
# locally (enforced by the git hooks in .githooks/). This workflow runs the
# data-free tier: package installation, import, the public API surface pin,
# the synthetic-data analysis tests, and the docs build. Data-dependent tests
# skip themselves cleanly when test/ is absent.

on:
  push:
    branches: [master, devel]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install rhkpy
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run test suite (data-dependent tests skip without test/)
        run: pytest -m "not slow" -ra

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install rhkpy and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . sphinx sphinx_rtd_theme

      - name: Build documentation
        run: sphinx-build -b html docs docs/_build/html
